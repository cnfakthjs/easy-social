{% extends "base.html" %}
{% block title %}Register - Easy Social{% endblock %}
{% block content %}
  <section class="auth-panel">
    <h1>Create account</h1>
    <form method="post" class="form-stack">
      <label>
        Username
        <input name="username" maxlength="40" autocomplete="username" required>
      </label>
      <label>
        Email
        <input name="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="new-password" required>
      </label>
      <label>
        驗證碼
        <img src="{{ url_for('auth.captcha_image') }}" alt="CAPTCHA" id="captcha-img" style="display:block; margin: 8px 0; border-radius:4px;">
        <span class="muted" style="font-size:0.85rem; cursor:pointer;" onclick="document.getElementById('captcha-img').src='{{ url_for('auth.captcha_image') }}?r='+Math.random()">看不清楚？點我換一張</span>
        <input name="captcha" maxlength="10" autocomplete="off" required placeholder="輸入上方圖片文字">
      </label>
      <button type="submit">Register</button>
    </form>
    <p class="muted">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
  </section>
{% endblock %}
